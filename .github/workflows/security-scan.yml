# .github/workflows/security-scan.yml
name: Security Compliance Suite

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository to scan'
        required: false
        type: string
        default: ${{ github.repository }}
      severity-threshold:
        description: 'Minimum severity to fail the build'
        required: false
        type: string
        default: 'HIGH'
      compliance-frameworks:
        description: 'Compliance frameworks to check (comma-separated)'
        required: false
        type: string
        default: 'openssf,owasp,slsa'
      enable-signing:
        description: 'Enable Sigstore signing'
        required: false
        type: boolean
        default: true
    secrets:
      SNYK_TOKEN:
        required: false
      SONAR_TOKEN:
        required: false
      NVD_API_KEY:
        required: false
      # Note: callers should pass GITHUB_TOKEN via `secrets: inherit` when
      # invoking this reusable workflow. Do NOT declare a secret named
      # `GITHUB_TOKEN` here because that name is reserved by GitHub Actions and
      # causes a collision when used in `workflow_call`.
    outputs:
      security-score:
        description: 'Overall security score'
        value: ${{ jobs.aggregate-results.outputs.score }}
      compliance-status:
        description: 'Compliance check results'
        value: ${{ jobs.aggregate-results.outputs.compliance }}
      vulnerabilities:
        description: 'Vulnerability summary'
        value: ${{ jobs.aggregate-results.outputs.vulnerabilities }}

jobs:
  # 🔍 Secret Scanning
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@47e7b7cd74f578e1e3145d48f669f22fd1330ca6 # v3.94.3
        with:
          path: ./
          extra_args: --results=verified,unknown
          # Only diff on pull_request. Passing the default branch as base on
          # schedule, workflow_dispatch, or push-to-default makes BASE==HEAD
          # and the action exits 1 without scanning.
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}

  # 🛡️ SAST - Static Application Security Testing
  #
  # CodeQL runs once with only the languages present in the caller. The old
  # 5-language matrix failed on repos that did not contain those languages and
  # also ran Semgrep five times. Semgrep is a single step here.
  sast-scan:
    name: SAST Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect CodeQL languages
        id: langs
        run: |
          langs=()
          if [ -f package.json ] || [ -f tsconfig.json ] || [ -n "$(find . -maxdepth 3 -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' \) -not -path './node_modules/*' | head -1)" ]; then
            langs+=("javascript-typescript")
          fi
          if [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ] || [ -n "$(find . -maxdepth 3 -name '*.py' -not -path './node_modules/*' | head -1)" ]; then
            langs+=("python")
          fi
          if [ -f go.mod ]; then
            langs+=("go")
          fi
          if [ -f pom.xml ] || [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            langs+=("java-kotlin")
          fi
          if [ ${#langs[@]} -eq 0 ]; then
            echo "list=" >> "$GITHUB_OUTPUT"
            echo "has=false" >> "$GITHUB_OUTPUT"
          else
            IFS=,
            echo "list=${langs[*]}" >> "$GITHUB_OUTPUT"
            echo "has=true" >> "$GITHUB_OUTPUT"
          fi

      # GitHub rejects advanced CodeQL SARIF while default setup is enabled
      # ("CodeQL analyses from advanced configurations cannot be processed
      # when the default setup is enabled"). Skip our CodeQL in that case;
      # default setup already covers the repo. Semgrep still runs.
      - name: Check CodeQL default setup
        id: default_setup
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            try {
              const { data } = await github.request(
                'GET /repos/{owner}/{repo}/code-scanning/default-setup',
                { owner: context.repo.owner, repo: context.repo.repo }
              );
              const enabled = data.state === 'configured' || data.state === 'configured-pending';
              core.setOutput('enabled', enabled ? 'true' : 'false');
              if (enabled) {
                core.info('CodeQL default setup is enabled; skipping advanced CodeQL. Semgrep still runs.');
              }
            } catch (err) {
              core.info(`Could not read CodeQL default setup (${err.status || err.message}); attempting advanced CodeQL.`);
              core.setOutput('enabled', 'false');
            }

      - name: Initialize CodeQL
        if: steps.langs.outputs.has == 'true' && steps.default_setup.outputs.enabled != 'true'
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ steps.langs.outputs.list }}

      - name: Perform CodeQL Analysis
        if: steps.langs.outputs.has == 'true' && steps.default_setup.outputs.enabled != 'true'
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8

      - name: Set up Python for Semgrep
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install and run Semgrep
        run: |
          pip install --quiet semgrep
          SEMGREP_ARGS=(--sarif --output=semgrep.sarif)
          SEMGREP_ARGS+=(--config=p/security-audit --config=p/owasp-top-ten --config=p/r2c-security-audit)
          if [ -d "./policies/semgrep" ]; then
            SEMGREP_ARGS+=(--config=./policies/semgrep/)
          fi
          semgrep "${SEMGREP_ARGS[@]}" || true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # 📦 Dependency Scanning
  dependency-scan:
    name: Dependency Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --recursive
            ./

  # 🐳 Container Scanning
  #
  # Runs on every invocation; individual steps skip themselves when the
  # relevant files are absent. The previous `if: contains(fromJSON(...), ...)`
  # guard was broken because `head_commit.modified` is an array and the
  # expression never evaluated true.
  container-scan:
    name: Container Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect container files
        id: detect
        run: |
          if [ -f Dockerfile ] || compgen -G "Dockerfile.*" >/dev/null || [ -f docker-compose.yml ] || [ -f docker-compose.yaml ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Trivy
        if: steps.detect.outputs.found == 'true'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Run Hadolint
        if: steps.detect.outputs.found == 'true' && hashFiles('Dockerfile') != ''
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  # 🔏 SLSA Provenance & Sigstore
  supply-chain:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    if: ${{ inputs.enable-signing }}
    permissions:
      # Request only the minimal permission needed for OIDC/cosign operations.
      # Do NOT request `contents: write` or `packages: write` here so callers
      # that only grant read access can still reuse this workflow. If a
      # caller needs to grant elevated permissions (for signing/pushing to
      # package registries), they should set them in the calling workflow.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
      
      - name: Sign SBOM
        run: |
          cosign sign-blob --yes \
            --output-signature sbom.spdx.json.sig \
            --output-certificate sbom.spdx.json.crt \
            sbom.spdx.json
      
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.spdx.json.sig
            sbom.spdx.json.crt

  # Nested `slsa-github-generator` was removed: passing `GITHUB_TOKEN` as a
  # named secret makes GitHub refuse to start this reusable workflow (weekly
  # self-scan was a startup_failure), and `base64-subjects` was the commit SHA
  # rather than artifact hashes. Restore later with hashed SBOM subjects.

  # 📊 OpenSSF Scorecard
  openssf-scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: contains(inputs.compliance-frameworks, 'openssf')
    permissions:
      security-events: write
      id-token: write
      contents: read
      # Do not request `actions: read` here. Called jobs cannot exceed the
      # caller's token permissions; typical consumers do not grant `actions`.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # OpenSSF's publisher rejects workflows that grant id-token to any
          # non-scorecard job (this suite also signs SBOMs with Cosign).
          # SARIF still uploads to the repo Security tab.
          publish_results: false

      - name: Upload to Security Tab
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: scorecard.sarif
          category: scorecard

  # ✅ OWASP Compliance
  #
  # Note: a DAST step (OWASP ZAP) is intentionally omitted here because a
  # reusable workflow cannot know how to start the caller's application.
  # Callers that want DAST should add a separate job that boots their app
  # (e.g., via docker compose) and then runs `zaproxy/action-baseline`.
  owasp-check:
    name: OWASP Compliance
    runs-on: ubuntu-latest
    if: contains(inputs.compliance-frameworks, 'owasp')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: OWASP process controls
        run: |
          set -euo pipefail
          if [ ! -f SECURITY.md ] && [ ! -f docs/SECURITY.md ] && [ ! -f .github/SECURITY.md ]; then
            echo "::error::SECURITY.md is missing. OWASP expects a public vulnerability-disclosure policy."
            exit 1
          fi
          echo "SECURITY.md present"

      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NVD_API_KEY}" ]; then
            echo "Skipping OWASP Dependency-Check: NVD_API_KEY is not set."
            echo "CVE scanning still runs via OSV Scanner in the Dependency Security job."
            exit 0
          fi
          docker run --rm \
            -e NVD_API_KEY \
            -v "$(pwd)":/src \
            owasp/dependency-check \
            --scan /src \
            --format JSON \
            --nvdApiKey "$NVD_API_KEY" \
            --out /src/dependency-check-report.json

  # 🏁 Aggregate Results
  aggregate-results:
    name: Security Score & Compliance
    runs-on: ubuntu-latest
    # `supply-chain` is listed here so `needs.supply-chain.result` is a valid
    # context expression. It is gated by `inputs.enable-signing` at the job
    # level, so when signing is disabled `needs.supply-chain.result` is
    # `skipped` — which the score calculation handles.
    needs: [secret-scan, sast-scan, dependency-scan, container-scan, openssf-scorecard, owasp-check, supply-chain]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    outputs:
      score: ${{ steps.calculate.outputs.score }}
      compliance: ${{ steps.calculate.outputs.compliance }}
      vulnerabilities: ${{ steps.calculate.outputs.vulnerabilities }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      
      - name: Calculate Security Score
        id: calculate
        env:
          SECRET: ${{ needs.secret-scan.result }}
          SAST: ${{ needs.sast-scan.result }}
          DEPS: ${{ needs.dependency-scan.result }}
          CONTAINER: ${{ needs.container-scan.result }}
          OPENSFF: ${{ needs.openssf-scorecard.result }}
          OWASP: ${{ needs.owasp-check.result }}
          SUPPLY: ${{ needs.supply-chain.result }}
          SIGNING: ${{ inputs.enable-signing }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          SCORE=0
          TOTAL_CHECKS=0

          if [ "$SECRET" = "success" ]; then SCORE=$((SCORE + 20)); fi
          TOTAL_CHECKS=$((TOTAL_CHECKS + 20))

          if [ "$SAST" = "success" ]; then SCORE=$((SCORE + 25)); fi
          TOTAL_CHECKS=$((TOTAL_CHECKS + 25))

          if [ "$DEPS" = "success" ]; then SCORE=$((SCORE + 25)); fi
          TOTAL_CHECKS=$((TOTAL_CHECKS + 25))

          if [ "$CONTAINER" = "skipped" ] || [ "$CONTAINER" = "success" ]; then SCORE=$((SCORE + 15)); fi
          TOTAL_CHECKS=$((TOTAL_CHECKS + 15))

          if [ "$OPENSFF" = "success" ]; then SCORE=$((SCORE + 15)); fi
          TOTAL_CHECKS=$((TOTAL_CHECKS + 15))

          if [ "$SIGNING" = "true" ]; then
            if [ "$SUPPLY" = "success" ]; then SCORE=$((SCORE + 15)); fi
            TOTAL_CHECKS=$((TOTAL_CHECKS + 15))
            SLSA_STATUS="$SUPPLY"
          else
            SLSA_STATUS="not_requested"
          fi

          FINAL_SCORE=$((SCORE * 100 / TOTAL_CHECKS))
          echo "score=$FINAL_SCORE" >> "$GITHUB_OUTPUT"

          FAILED=""
          for pair in "secret:$SECRET" "sast:$SAST" "dependency:$DEPS" "container:$CONTAINER" "openssf:$OPENSFF" "owasp:$OWASP"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [ "$result" = "failure" ]; then
              FAILED="${FAILED}${FAILED:+,}${name}"
            fi
          done
          echo "vulnerabilities=${FAILED:-none}" >> "$GITHUB_OUTPUT"

          COMPLIANCE="{\"openssf\":\"$OPENSFF\",\"owasp\":\"$OWASP\",\"slsa\":\"$SLSA_STATUS\"}"
          echo "compliance=$COMPLIANCE" >> "$GITHUB_OUTPUT"

          cat > security-summary.json <<EOF
          {
            "schema": "acald-creator/security-compliance-hub/security-summary/v1",
            "repository": "$REPOSITORY",
            "sha": "$SHA",
            "score": $FINAL_SCORE,
            "compliance": $COMPLIANCE,
            "jobs": {
              "secret": "$SECRET",
              "sast": "$SAST",
              "dependency": "$DEPS",
              "container": "$CONTAINER",
              "openssf": "$OPENSFF",
              "owasp": "$OWASP",
              "supply_chain": "$SUPPLY"
            },
            "failed": "${FAILED:-none}"
          }
          EOF

      - name: Upload security summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-summary
          path: security-summary.json

      - name: Comment on pull request
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const score = ${{ steps.calculate.outputs.score }};
            const badge = score >= 80 ? '🟢' : score >= 60 ? '🟡' : '🔴';
            const comment = `## ${badge} Security Scan Results

            **Overall Score:** ${score}/100

            ### Compliance Status
            - OpenSSF Scorecard: ${{ needs.openssf-scorecard.result }}
            - OWASP Compliance: ${{ needs.owasp-check.result }}
            - Supply Chain Security: ${{ needs.supply-chain.result }}

            ### Security Checks
            - Secret Scanning: ${{ needs.secret-scan.result }}
            - SAST Analysis: ${{ needs.sast-scan.result }}
            - Dependency Scan: ${{ needs.dependency-scan.result }}
            - Container Security: ${{ needs.container-scan.result }}

            Machine-readable summary: artifact \`security-summary\` (\`security-summary.json\`).
            [Security tab](https://github.com/${{ github.repository }}/security)`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });