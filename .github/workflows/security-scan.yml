# .github/workflows/security-scan.yml
name: Security Compliance Suite

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository to scan'
        required: false
        type: string
        default: ${{ github.repository }}
      severity-threshold:
        description: 'Minimum severity to fail the build'
        required: false
        type: string
        default: 'HIGH'
      compliance-frameworks:
        description: 'Compliance frameworks to check (comma-separated)'
        required: false
        type: string
        default: 'openssf,owasp,slsa'
      enable-signing:
        description: 'Enable Sigstore signing'
        required: false
        type: boolean
        default: true
      artifact-path:
        description: 'Optional path to a built artifact for SLSA provenance attestation'
        required: false
        type: string
        default: ''
      artifact-name:
        description: 'Optional uploaded artifact name to download before attestation'
        required: false
        type: string
        default: ''
      require-owasp-dependency-check:
        description: 'Fail when OWASP Dependency-Check is enabled but NVD_API_KEY is missing'
        required: false
        type: boolean
        default: false
    secrets:
      SNYK_TOKEN:
        required: false
      SONAR_TOKEN:
        required: false
      NVD_API_KEY:
        required: false
      # Note: GITHUB_TOKEN is provided automatically to called workflows.
      # Callers should pass optional secrets by name, not `secrets: inherit`
      # (Semgrep flags inherit as a finding on every consumer).
    outputs:
      security-score:
        description: 'Overall security score'
        value: ${{ jobs.aggregate-results.outputs.score }}
      compliance-status:
        description: 'Compliance check results'
        value: ${{ jobs.aggregate-results.outputs.compliance }}
      vulnerabilities:
        description: 'Vulnerability summary'
        value: ${{ jobs.aggregate-results.outputs.vulnerabilities }}
      provenance-status:
        description: 'SLSA provenance status for the supplied artifact'
        value: ${{ jobs.aggregate-results.outputs.provenance_status }}
      owasp-dependency-check-status:
        description: 'OWASP Dependency-Check evidence status'
        value: ${{ jobs.aggregate-results.outputs.owasp_dependency_check_status }}
      sbom-digest:
        description: 'SHA-256 digest of the generated SPDX SBOM'
        value: ${{ jobs.aggregate-results.outputs.sbom_digest }}
      artifact-digest:
        description: 'SHA-256 digest of the attested artifact'
        value: ${{ jobs.aggregate-results.outputs.artifact_digest }}
      attestation-url:
        description: 'URL of the generated artifact attestation summary'
        value: ${{ jobs.aggregate-results.outputs.attestation_url }}
      dependency-scan-status:
        description: 'Dependency scanner applicability and result'
        value: ${{ jobs.aggregate-results.outputs.dependency_status }}

jobs:
  # 🔍 Secret Scanning
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate severity policy
        env:
          THRESHOLD: ${{ inputs.severity-threshold }}
        run: |
          set -euo pipefail
          case "${THRESHOLD^^}" in
            CRITICAL|HIGH|MEDIUM|LOW|UNKNOWN) ;;
            *)
              echo "::error::Unsupported severity-threshold: $THRESHOLD"
              echo "Supported values: CRITICAL, HIGH, MEDIUM, LOW, UNKNOWN"
              exit 1
              ;;
          esac
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@47e7b7cd74f578e1e3145d48f669f22fd1330ca6 # v3.94.3
        with:
          path: ./
          extra_args: --results=verified,unknown
          # Only diff on pull_request. Passing the default branch as base on
          # schedule, workflow_dispatch, or push-to-default makes BASE==HEAD
          # and the action exits 1 without scanning.
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}

  # 🛡️ SAST - Static Application Security Testing
  #
  # CodeQL runs once with only the languages present in the caller. The old
  # 5-language matrix failed on repos that did not contain those languages and
  # also ran Semgrep five times. Semgrep is a single step here.
  sast-scan:
    name: SAST Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect CodeQL languages
        id: langs
        run: |
          langs=()
          if [ -f package.json ] || [ -f tsconfig.json ] || [ -n "$(find . -maxdepth 3 -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' \) -not -path './node_modules/*' | head -1)" ]; then
            langs+=("javascript-typescript")
          fi
          if [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ] || [ -n "$(find . -maxdepth 3 -name '*.py' -not -path './node_modules/*' | head -1)" ]; then
            langs+=("python")
          fi
          if [ -f go.mod ]; then
            langs+=("go")
          fi
          if [ -f pom.xml ] || [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            langs+=("java-kotlin")
          fi
          if [ ${#langs[@]} -eq 0 ]; then
            echo "list=" >> "$GITHUB_OUTPUT"
            echo "has=false" >> "$GITHUB_OUTPUT"
          else
            IFS=,
            echo "list=${langs[*]}" >> "$GITHUB_OUTPUT"
            echo "has=true" >> "$GITHUB_OUTPUT"
          fi

      # GitHub rejects advanced CodeQL SARIF while default setup is enabled
      # ("CodeQL analyses from advanced configurations cannot be processed
      # when the default setup is enabled"). Skip our CodeQL in that case;
      # default setup already covers the repo. Semgrep still runs. If the
      # default-setup API cannot be read, advanced CodeQL is attempted and a
      # real CodeQL failure must fail this job.
      - name: Check CodeQL default setup
        id: default_setup
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            try {
              const { data } = await github.request(
                'GET /repos/{owner}/{repo}/code-scanning/default-setup',
                { owner: context.repo.owner, repo: context.repo.repo }
              );
              const enabled = data.state === 'configured' || data.state === 'configured-pending';
              core.setOutput('enabled', enabled ? 'true' : 'false');
              if (enabled) {
                core.info('CodeQL default setup is enabled; skipping advanced CodeQL. Semgrep still runs.');
              }
            } catch (err) {
              core.info(`Could not read CodeQL default setup (${err.status || err.message}); attempting advanced CodeQL. A CodeQL failure will fail SAST.`);
              core.setOutput('enabled', 'false');
            }

      - name: Initialize CodeQL
        if: steps.langs.outputs.has == 'true' && steps.default_setup.outputs.enabled != 'true'
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ steps.langs.outputs.list }}

      - name: Perform CodeQL Analysis
        if: steps.langs.outputs.has == 'true' && steps.default_setup.outputs.enabled != 'true'
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8

      - name: Set up Python for Semgrep
        if: always()
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install and run Semgrep
        if: always()
        env:
          THRESHOLD: ${{ inputs.severity-threshold }}
        run: |
          set -euo pipefail
          pip install --quiet semgrep
          SEMGREP_ARGS=(--sarif --output=semgrep.sarif)
          SEMGREP_ARGS+=(--config=p/security-audit --config=p/owasp-top-ten --config=p/r2c-security-audit)
          if [ -d "./policies/semgrep" ]; then
            SEMGREP_ARGS+=(--config=./policies/semgrep/)
          fi
          case "${THRESHOLD^^}" in
            CRITICAL|HIGH) SEMGREP_ARGS+=(--severity=ERROR) ;;
            MEDIUM) SEMGREP_ARGS+=(--severity=WARNING) ;;
            LOW|UNKNOWN) SEMGREP_ARGS+=(--severity=INFO) ;;
            *) echo "::error::Unsupported severity-threshold: $THRESHOLD"; exit 1 ;;
          esac
          semgrep "${SEMGREP_ARGS[@]}" --error

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # 📦 Dependency Scanning
  dependency-scan:
    name: Dependency Security
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.record_dependency_status.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect dependency manifests
        id: dependency_manifests
        run: |
          set -euo pipefail
          manifests=$(find . -type f \( \
            -name 'package.json' -o -name 'package-lock.json' -o -name 'bun.lock' -o -name 'bun.lockb' -o \
            -name 'yarn.lock' -o -name 'pnpm-lock.yaml' -o -name 'go.mod' -o -name 'Cargo.toml' -o \
            -name 'Gemfile' -o -name 'requirements*.txt' -o -name 'pyproject.toml' -o -name 'poetry.lock' -o \
            -name 'Pipfile.lock' -o -name 'pom.xml' -o -name 'build.gradle' -o -name 'build.gradle.kts' -o \
            -name 'gradle.lockfile' -o -name 'composer.lock' -o -name 'mix.lock' \
          \) -not -path './.git/*' -print)
          if [ -n "$manifests" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Dependency manifests found:"
            printf '%s\n' "$manifests"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No dependency manifests found; OSV scanning is not applicable."
          fi

      - name: OSV Scanner
        id: osv_scanner
        if: steps.dependency_manifests.outputs.found == 'true'
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --recursive
            ./

      - name: Record dependency scan status
        id: record_dependency_status
        if: always()
        env:
          MANIFESTS_FOUND: ${{ steps.dependency_manifests.outputs.found }}
          OSV_OUTCOME: ${{ steps.osv_scanner.outcome }}
        run: |
          set -euo pipefail
          if [ "$MANIFESTS_FOUND" = "false" ]; then
            status="not_applicable"
          elif [ "$MANIFESTS_FOUND" != "true" ]; then
            status="unknown"
          elif [ "$OSV_OUTCOME" = "success" ]; then
            status="passed"
          elif [ "$OSV_OUTCOME" = "failure" ]; then
            status="failed"
          else
            status="unknown"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Dependency scan status: $status"

  # 🐳 Container Scanning
  #
  # Runs on every invocation; individual steps skip themselves when the
  # relevant files are absent. The previous `if: contains(fromJSON(...), ...)`
  # guard was broken because `head_commit.modified` is an array and the
  # expression never evaluated true.
  container-scan:
    name: Container Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect container files
        id: detect
        run: |
          if [ -f Dockerfile ] || compgen -G "Dockerfile.*" >/dev/null || [ -f docker-compose.yml ] || [ -f docker-compose.yaml ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Trivy
        if: steps.detect.outputs.found == 'true'
        id: trivy
        env:
          THRESHOLD: ${{ inputs.severity-threshold }}
        run: |
          set -euo pipefail
          case "${THRESHOLD^^}" in
            CRITICAL) echo "severity=CRITICAL" >> "$GITHUB_OUTPUT" ;;
            HIGH) echo "severity=CRITICAL,HIGH" >> "$GITHUB_OUTPUT" ;;
            MEDIUM) echo "severity=CRITICAL,HIGH,MEDIUM" >> "$GITHUB_OUTPUT" ;;
            LOW) echo "severity=CRITICAL,HIGH,MEDIUM,LOW" >> "$GITHUB_OUTPUT" ;;
            UNKNOWN) echo "severity=UNKNOWN,CRITICAL,HIGH,MEDIUM,LOW" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Unsupported severity-threshold: $THRESHOLD"
              exit 1
              ;;
          esac

      - name: Scan filesystem with Trivy
        if: steps.detect.outputs.found == 'true'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: ${{ steps.trivy.outputs.severity }}
          exit-code: '1'

      - name: Run Hadolint
        if: steps.detect.outputs.found == 'true' && hashFiles('Dockerfile') != ''
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  # 🔏 SLSA Provenance & Sigstore
  supply-chain:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    if: ${{ inputs.enable-signing }}
    outputs:
      provenance_status: ${{ steps.provenance_status.outputs.status }}
      sbom_digest: ${{ steps.provenance_status.outputs.sbom_digest }}
      sbom_signature_digest: ${{ steps.provenance_status.outputs.sbom_signature_digest }}
      sbom_certificate_digest: ${{ steps.provenance_status.outputs.sbom_certificate_digest }}
      artifact_digest: ${{ steps.provenance_status.outputs.artifact_digest }}
      attestation_id: ${{ steps.provenance_status.outputs.attestation_id }}
      attestation_url: ${{ steps.provenance_status.outputs.attestation_url }}
    permissions:
      # Request only the minimal permission needed for OIDC/cosign operations.
      # Do NOT request `contents: write` or `packages: write` here so callers
      # that only grant read access can still reuse this workflow. If a
      # caller needs to grant elevated permissions (for signing/pushing to
      # package registries), they should set them in the calling workflow.
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
      
      - name: Sign SBOM
        run: |
          cosign sign-blob --yes \
            --output-signature sbom.spdx.json.sig \
            --output-certificate sbom.spdx.json.crt \
            sbom.spdx.json

      - name: Download artifact subject
        if: inputs.artifact-name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: .

      - name: Validate provenance subject
        id: provenance_subject
        env:
          SUBJECT_PATH: ${{ inputs.artifact-path }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
        run: |
          set -euo pipefail
          if [ -z "$SUBJECT_PATH" ]; then
            if [ -n "$ARTIFACT_NAME" ]; then
              echo "::error::artifact-path is required when artifact-name is configured."
              exit 1
            fi
            echo "No artifact-path supplied; SBOM signing will run without SLSA provenance."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f "$SUBJECT_PATH" ]; then
            echo "::error::Configured artifact-path does not exist: $SUBJECT_PATH"
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Generate SLSA provenance attestation
        id: provenance
        if: steps.provenance_subject.outputs.available == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ inputs.artifact-path }}

      - name: Record provenance status
        id: provenance_status
        if: always()
        env:
          SUBJECT_PATH: ${{ inputs.artifact-path }}
          VALIDATION_OUTCOME: ${{ steps.provenance_subject.outcome }}
          ATTESTATION_OUTCOME: ${{ steps.provenance.outcome }}
          ATTESTATION_ID: ${{ steps.provenance.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.provenance.outputs.attestation-url }}
        run: |
          set -euo pipefail
          if [ -z "$SUBJECT_PATH" ]; then
            status="not_requested"
          elif [ "$VALIDATION_OUTCOME" = "failure" ] || [ "$ATTESTATION_OUTCOME" = "failure" ]; then
            status="failed"
          elif [ "$ATTESTATION_OUTCOME" = "success" ]; then
            status="attested"
          else
            status="unknown"
          fi
          digest_for() {
            if [ -f "$1" ]; then
              sha256sum "$1" | awk '{print "sha256:" $1}'
            else
              echo ""
            fi
          }
          echo "sbom_digest=$(digest_for sbom.spdx.json)" >> "$GITHUB_OUTPUT"
          echo "sbom_signature_digest=$(digest_for sbom.spdx.json.sig)" >> "$GITHUB_OUTPUT"
          echo "sbom_certificate_digest=$(digest_for sbom.spdx.json.crt)" >> "$GITHUB_OUTPUT"
          if [ -n "$SUBJECT_PATH" ]; then
            echo "artifact_digest=$(digest_for "$SUBJECT_PATH")" >> "$GITHUB_OUTPUT"
          else
            echo "artifact_digest=" >> "$GITHUB_OUTPUT"
          fi
          echo "attestation_id=$ATTESTATION_ID" >> "$GITHUB_OUTPUT"
          echo "attestation_url=$ATTESTATION_URL" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "SLSA provenance status: $status"
      
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.spdx.json.sig
            sbom.spdx.json.crt

  # Nested `slsa-github-generator` was removed: passing `GITHUB_TOKEN` as a
  # named secret makes GitHub refuse to start this reusable workflow (weekly
  # self-scan was a startup_failure), and `base64-subjects` was the commit SHA
  # rather than artifact hashes. Restore later with hashed SBOM subjects.

  # 📊 OpenSSF Scorecard
  openssf-scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: contains(inputs.compliance-frameworks, 'openssf')
    permissions:
      security-events: write
      id-token: write
      contents: read
      # Do not request `actions: read` here. Called jobs cannot exceed the
      # caller's token permissions; typical consumers do not grant `actions`.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # OpenSSF's publisher rejects workflows that grant id-token to any
          # non-scorecard job (this suite also signs SBOMs with Cosign).
          # SARIF still uploads to the repo Security tab.
          publish_results: false

      - name: Upload to Security Tab
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: scorecard.sarif
          category: scorecard

  # ✅ OWASP Compliance
  #
  # Note: a DAST step (OWASP ZAP) is intentionally omitted here because a
  # reusable workflow cannot know how to start the caller's application.
  # Callers that want DAST should add a separate job that boots their app
  # (e.g., via docker compose) and then runs `zaproxy/action-baseline`.
  owasp-check:
    name: OWASP Compliance
    runs-on: ubuntu-latest
    if: contains(inputs.compliance-frameworks, 'owasp')
    outputs:
      dependency_check_status: ${{ steps.record_dependency_check_status.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: OWASP process controls
        run: |
          set -euo pipefail
          if [ ! -f SECURITY.md ] && [ ! -f docs/SECURITY.md ] && [ ! -f .github/SECURITY.md ]; then
            echo "::error::SECURITY.md is missing. OWASP expects a public vulnerability-disclosure policy."
            exit 1
          fi
          echo "SECURITY.md present"

      - name: OWASP Dependency-Check
        id: dependency_check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          REQUIRE_OWASP_DEPENDENCY_CHECK: ${{ inputs.require-owasp-dependency-check }}
        run: |
          set -euo pipefail
          if [ -z "${NVD_API_KEY}" ]; then
            echo "::warning::OWASP Dependency-Check is unknown: NVD_API_KEY is not set."
            echo "CVE scanning still runs via OSV Scanner in the Dependency Security job."
            echo "status=unknown" >> "$GITHUB_OUTPUT"
            if [ "$REQUIRE_OWASP_DEPENDENCY_CHECK" = "true" ]; then
              echo "::error::require-owasp-dependency-check is enabled but NVD_API_KEY is missing."
              exit 1
            fi
            exit 0
          fi
          docker run --rm \
            -e NVD_API_KEY \
            -v "$(pwd)":/src \
            owasp/dependency-check \
            --scan /src \
            --format JSON \
            --nvdApiKey "$NVD_API_KEY" \
            --out /src/dependency-check-report.json
          echo "status=passed" >> "$GITHUB_OUTPUT"

      - name: Record OWASP Dependency-Check status
        id: record_dependency_check_status
        if: always()
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          DEPENDENCY_CHECK_OUTCOME: ${{ steps.dependency_check.outcome }}
        run: |
          set -euo pipefail
          if [ -z "$NVD_API_KEY" ]; then
            status="unknown"
          elif [ "$DEPENDENCY_CHECK_OUTCOME" = "success" ]; then
            status="passed"
          elif [ "$DEPENDENCY_CHECK_OUTCOME" = "failure" ]; then
            status="failed"
          else
            status="unknown"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "OWASP Dependency-Check evidence status: $status"

  # 🏁 Aggregate Results
  aggregate-results:
    name: Security Score & Compliance
    runs-on: ubuntu-latest
    # `supply-chain` is listed here so `needs.supply-chain.result` is a valid
    # context expression. It is gated by `inputs.enable-signing` at the job
    # level, so when signing is disabled `needs.supply-chain.result` is
    # `skipped` — which the score calculation handles.
    needs: [secret-scan, sast-scan, dependency-scan, container-scan, openssf-scorecard, owasp-check, supply-chain]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    outputs:
      score: ${{ steps.calculate.outputs.score }}
      compliance: ${{ steps.calculate.outputs.compliance }}
      vulnerabilities: ${{ steps.calculate.outputs.vulnerabilities }}
      provenance_status: ${{ steps.calculate.outputs.provenance }}
      owasp_dependency_check_status: ${{ steps.calculate.outputs.owasp_dependency_check }}
      sbom_digest: ${{ steps.calculate.outputs.sbom_digest }}
      artifact_digest: ${{ steps.calculate.outputs.artifact_digest }}
      attestation_url: ${{ steps.calculate.outputs.attestation_url }}
      dependency_status: ${{ steps.calculate.outputs.dependency_status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      
      - name: Calculate Security Score
        id: calculate
        env:
          SECRET: ${{ needs.secret-scan.result }}
          SAST: ${{ needs.sast-scan.result }}
          DEPS: ${{ needs.dependency-scan.result }}
          CONTAINER: ${{ needs.container-scan.result }}
          OPENSFF: ${{ needs.openssf-scorecard.result }}
          OWASP: ${{ needs.owasp-check.result }}
          SUPPLY: ${{ needs.supply-chain.result }}
          SIGNING: ${{ inputs.enable-signing }}
          SLSA: ${{ needs.supply-chain.outputs.provenance_status }}
          OWASP_EVIDENCE: ${{ needs.owasp-check.outputs.dependency_check_status }}
          SBOM_DIGEST: ${{ needs.supply-chain.outputs.sbom_digest }}
          SBOM_SIGNATURE_DIGEST: ${{ needs.supply-chain.outputs.sbom_signature_digest }}
          SBOM_CERTIFICATE_DIGEST: ${{ needs.supply-chain.outputs.sbom_certificate_digest }}
          ARTIFACT_DIGEST: ${{ needs.supply-chain.outputs.artifact_digest }}
          ATTESTATION_ID: ${{ needs.supply-chain.outputs.attestation_id }}
          ATTESTATION_URL: ${{ needs.supply-chain.outputs.attestation_url }}
          DEPS_EVIDENCE: ${{ needs.dependency-scan.outputs.status }}
          FRAMEWORKS: ${{ inputs.compliance-frameworks }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          SCORE=0
          TOTAL_CHECKS=0

          FRAMEWORKS="${FRAMEWORKS,,}"
          FRAMEWORKS="${FRAMEWORKS// /}"
          framework_enabled() {
            case ",${FRAMEWORKS}," in
              *",$1,"*) return 0 ;;
              *) return 1 ;;
            esac
          }

          if [ "$SECRET" = "success" ]; then SCORE=$((SCORE + 20)); fi
          TOTAL_CHECKS=$((TOTAL_CHECKS + 20))

          if [ "$SAST" = "success" ]; then SCORE=$((SCORE + 25)); fi
          TOTAL_CHECKS=$((TOTAL_CHECKS + 25))

          if [ "$DEPS_EVIDENCE" = "passed" ]; then SCORE=$((SCORE + 25)); fi
          if [ "$DEPS_EVIDENCE" != "not_applicable" ]; then TOTAL_CHECKS=$((TOTAL_CHECKS + 25)); fi

          if [ "$CONTAINER" = "skipped" ] || [ "$CONTAINER" = "success" ]; then SCORE=$((SCORE + 15)); fi
          TOTAL_CHECKS=$((TOTAL_CHECKS + 15))

          if framework_enabled openssf; then
            if [ "$OPENSFF" = "success" ]; then SCORE=$((SCORE + 15)); fi
            TOTAL_CHECKS=$((TOTAL_CHECKS + 15))
            OPENSSF_STATUS="$OPENSFF"
          else
            OPENSSF_STATUS="not_requested"
          fi

          if [ "$SIGNING" = "true" ]; then
            if [ "$SUPPLY" = "success" ]; then SCORE=$((SCORE + 15)); fi
            TOTAL_CHECKS=$((TOTAL_CHECKS + 15))
            SLSA_STATUS="${SLSA:-unknown}"
          else
            SLSA_STATUS="not_requested"
          fi

          if [ "$OWASP" = "skipped" ]; then
            OWASP_EVIDENCE_STATUS="not_requested"
          elif [ -n "$OWASP_EVIDENCE" ]; then
            OWASP_EVIDENCE_STATUS="$OWASP_EVIDENCE"
          else
            OWASP_EVIDENCE_STATUS="unknown"
          fi

          SBOM_DIGEST="${SBOM_DIGEST:-unknown}"
          SBOM_SIGNATURE_DIGEST="${SBOM_SIGNATURE_DIGEST:-unknown}"
          SBOM_CERTIFICATE_DIGEST="${SBOM_CERTIFICATE_DIGEST:-unknown}"
          ARTIFACT_DIGEST="${ARTIFACT_DIGEST:-unknown}"
          ATTESTATION_ID="${ATTESTATION_ID:-unknown}"
          ATTESTATION_URL="${ATTESTATION_URL:-unknown}"

          FINAL_SCORE=$((SCORE * 100 / TOTAL_CHECKS))
          echo "score=$FINAL_SCORE" >> "$GITHUB_OUTPUT"
          echo "provenance=$SLSA_STATUS" >> "$GITHUB_OUTPUT"
          echo "owasp_dependency_check=$OWASP_EVIDENCE_STATUS" >> "$GITHUB_OUTPUT"
          echo "dependency_status=${DEPS_EVIDENCE:-unknown}" >> "$GITHUB_OUTPUT"

          FAILED=""
          for pair in "secret:$SECRET" "sast:$SAST" "dependency:$DEPS" "container:$CONTAINER" "openssf:$OPENSFF" "owasp:$OWASP" "supply_chain:$SUPPLY"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [ "$result" = "failure" ]; then
              FAILED="${FAILED}${FAILED:+,}${name}"
            fi
          done
          echo "vulnerabilities=${FAILED:-none}" >> "$GITHUB_OUTPUT"

          COMPLIANCE="{\"openssf\":\"$OPENSSF_STATUS\",\"owasp\":\"$OWASP_EVIDENCE_STATUS\",\"slsa\":\"$SLSA_STATUS\"}"
          echo "compliance=$COMPLIANCE" >> "$GITHUB_OUTPUT"

          cat > security-summary.json <<EOF
          {
            "schema": "acald-creator/security-compliance-hub/security-summary/v1",
            "repository": "$REPOSITORY",
            "sha": "$SHA",
            "score": $FINAL_SCORE,
            "compliance": $COMPLIANCE,
            "evidence": {
              "sbom_signing": "$SUPPLY",
              "slsa_provenance": "$SLSA_STATUS",
              "owasp_dependency_check": "$OWASP_EVIDENCE_STATUS",
              "dependency_scan": "${DEPS_EVIDENCE:-unknown}",
              "artifact_digest": "$ARTIFACT_DIGEST",
              "sbom_digest": "$SBOM_DIGEST",
              "sbom_signature_digest": "$SBOM_SIGNATURE_DIGEST",
              "sbom_certificate_digest": "$SBOM_CERTIFICATE_DIGEST",
              "attestation_id": "$ATTESTATION_ID",
              "attestation_url": "$ATTESTATION_URL"
            },
            "jobs": {
              "secret": "$SECRET",
              "sast": "$SAST",
              "dependency": "$DEPS",
              "container": "$CONTAINER",
              "openssf": "$OPENSFF",
              "owasp": "$OWASP",
              "supply_chain": "$SUPPLY"
            },
            "failed": "${FAILED:-none}"
          }
          EOF

      - name: Upload security summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-summary
          path: security-summary.json

      - name: Comment on pull request
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const score = ${{ steps.calculate.outputs.score }};
            const badge = score >= 80 ? '🟢' : score >= 60 ? '🟡' : '🔴';
            const comment = `## ${badge} Security Scan Results

            **Overall Score:** ${score}/100

            ### Compliance Status
            - OpenSSF Scorecard: ${{ needs.openssf-scorecard.result }}
            - OWASP Dependency-Check: ${{ needs.owasp-check.outputs.dependency_check_status || 'not_requested' }}
            - SBOM signing: ${{ needs.supply-chain.result }}
            - SLSA provenance: ${{ needs.supply-chain.outputs.provenance_status || 'not_requested' }}
            - SBOM digest: ${{ needs.supply-chain.outputs.sbom_digest || 'not_available' }}

            ### Security Checks
            - Secret Scanning: ${{ needs.secret-scan.result }}
            - SAST Analysis: ${{ needs.sast-scan.result }}
            - Dependency Scan: ${{ needs.dependency-scan.result }}
            - Dependency evidence: ${{ needs.dependency-scan.outputs.status || 'unknown' }}
            - Container Security: ${{ needs.container-scan.result }}

            Machine-readable summary: artifact \`security-summary\` (\`security-summary.json\`).
            [Security tab](https://github.com/${{ github.repository }}/security)`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
