# .github/workflows/devsecops-infinity.yml
name: DevSecOps Infinity Loop

on:
  workflow_call:
    inputs:
      phase:
        description: 'Current phase in DevSecOps loop'
        required: true
        type: string
      registry:
        description: 'Container registry hostname (e.g. ghcr.io)'
        required: false
        type: string
        default: 'ghcr.io'
      image:
        # Defaults to `${{ github.repository }}` at step time.
        # `workflow_call` input defaults cannot reference the `github` context,
        # so we resolve this at runtime inside each step that uses it.
        description: 'Image path within the registry (defaults to github.repository)'
        required: false
        type: string
        default: ''
      image-tag:
        description: 'Image tag to sign or verify (defaults to the current commit SHA)'
        required: false
        type: string
        default: ''
      certificate-identity-regexp:
        description: 'Trusted Cosign certificate identity regexp for image verification'
        required: false
        type: string
        default: ''
      certificate-oidc-issuer-regexp:
        description: 'Trusted Cosign OIDC issuer regexp for image verification'
        required: false
        type: string
        default: '^https://token.actions.githubusercontent.com$'
      require-image-verification:
        description: 'Fail deploy when a Docker image is expected but not published'
        required: false
        type: boolean
        default: false
    outputs:
      image-verification-status:
        description: 'Published-image verification result: verified, not_found, failed, not_applicable, or not_requested'
        value: ${{ jobs.deploy-phase.outputs.image_verification_status || 'not_requested' }}
      image-digest:
        description: 'Digest of the image inspected during deploy verification'
        value: ${{ jobs.deploy-phase.outputs.image_digest || 'unknown' }}
      image-verification-reason:
        description: 'Human-readable image verification result'
        value: ${{ jobs.deploy-phase.outputs.image_verification_reason || 'Deploy verification was not requested' }}

jobs:
  # ♾️ PLAN - Threat Modeling & Security Requirements
  plan-phase:
    if: inputs.phase == 'plan' || inputs.phase == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Check for Threat Model
        run: |
          if [ ! -f "docs/THREAT_MODEL.md" ]; then
            echo "❌ Missing threat model documentation"
            exit 1
          fi
      
      - name: Validate Security Requirements
        run: |
          if [ ! -f "docs/SECURITY_REQUIREMENTS.md" ]; then
            echo "⚠️ Warning: No security requirements documented"
          fi
      
      - name: Check ADRs for Security Decisions
        run: |
          if ls docs/adr/*security*.md 1> /dev/null 2>&1; then
            echo "✅ Security ADRs found"
          else
            echo "⚠️ No security-related ADRs found"
          fi

  # ♾️ CODE - Secure Coding & Pre-commit Hooks
  code-phase:
    if: inputs.phase == 'code' || inputs.phase == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Verify Pre-commit Hooks
        run: |
          if [ -f "lefthook.yml" ] || [ -f ".pre-commit-config.yaml" ]; then
            echo "✅ Pre-commit hooks configured"
          else
            echo "❌ No pre-commit hooks found"
            exit 1
          fi
      
      - name: Check Code Signing
        run: |
          git log --show-signature -1 || echo "⚠️ Commit not signed"
      
      - name: Run Security Linters
        run: |
          if [ -f "biome.json" ]; then
            if ! command -v bun >/dev/null 2>&1; then
              curl -fsSL https://bun.sh/install | bash
              export PATH="$HOME/.bun/bin:$PATH"
            fi
            bunx @biomejs/biome check .
          fi

  # ♾️ BUILD - Secure Build & SBOM Generation
  build-phase:
    if: inputs.phase == 'build' || inputs.phase == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          format: spdx-json
          output-file: sbom.json
      
      - name: Scan Dependencies
        run: |
          if [ -f "package.json" ]; then
            if ! command -v bun >/dev/null 2>&1; then
              curl -fsSL https://bun.sh/install | bash
              export PATH="$HOME/.bun/bin:$PATH"
            fi
            bun install --frozen-lockfile || bun install
            bun audit
          elif [ -f "go.mod" ]; then
            if command -v govulncheck >/dev/null 2>&1; then
              govulncheck ./...
            else
              echo "govulncheck not installed; skipping Go vulnerability scan"
            fi
          fi
      
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            sbom.json

  # ♾️ TEST - Security Testing
  test-phase:
    if: inputs.phase == 'test' || inputs.phase == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Run Security Tests
        run: |
          # Run security-focused tests if a `tests/security` directory exists
          if [ -d "tests/security" ]; then
            bun test tests/security
          fi

      # DAST (ZAP) is intentionally omitted: a reusable workflow can't know
      # how to start the caller's application on a given port. Callers that
      # want DAST should add their own job that boots the app and then runs
      # `zaproxy/action-full-scan`.

  # ♾️ RELEASE - Signing & Attestation
  release-phase:
    if: inputs.phase == 'release' || inputs.phase == 'all'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    env:
      REGISTRY: ${{ inputs.registry }}
      IMAGE: ${{ inputs.image != '' && inputs.image || github.repository }}
      IMAGE_TAG: ${{ inputs.image-tag != '' && inputs.image-tag || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign Artifacts
        run: |
          if [ ! -f "Dockerfile" ]; then
            echo "No Dockerfile; skipping image signing"
            exit 0
          fi
          IMAGE_REF="${REGISTRY}/${IMAGE}:${IMAGE_TAG}"
          if ! command -v crane >/dev/null 2>&1; then
            curl -fsSL -o /tmp/crane.tar.gz \
              "https://github.com/google/go-containerregistry/releases/download/v0.20.3/go-containerregistry_Linux_x86_64.tar.gz"
            tar -xzf /tmp/crane.tar.gz -C /tmp crane
            sudo mv /tmp/crane /usr/local/bin/crane
          fi
          if ! crane digest "$IMAGE_REF" >/dev/null 2>&1; then
            echo "Image $IMAGE_REF is not published; skipping signing"
            exit 0
          fi
          cosign sign --yes "$IMAGE_REF"

      - name: Create Attestations
        if: hashFiles('sbom.json') != ''
        run: |
          cosign attest --yes \
            --predicate sbom.json \
            --type spdx \
            "${REGISTRY}/${IMAGE}:${{ github.sha }}"

  # ♾️ DEPLOY - Secure Deployment
  deploy-phase:
    if: inputs.phase == 'deploy' || inputs.phase == 'all'
    runs-on: ubuntu-latest
    outputs:
      image_verification_status: ${{ steps.record_image_verification.outputs.status }}
      image_digest: ${{ steps.record_image_verification.outputs.digest }}
      image_verification_reason: ${{ steps.record_image_verification.outputs.reason }}
    env:
      REGISTRY: ${{ inputs.registry }}
      IMAGE: ${{ inputs.image != '' && inputs.image || github.repository }}
      IMAGE_TAG: ${{ inputs.image-tag != '' && inputs.image-tag || github.sha }}
      CERTIFICATE_IDENTITY_REGEXP: ${{ inputs.certificate-identity-regexp }}
      CERTIFICATE_OIDC_ISSUER_REGEXP: ${{ inputs.certificate-oidc-issuer-regexp }}
      REQUIRE_IMAGE_VERIFICATION: ${{ inputs.require-image-verification }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Verify Image Signatures
        id: verify_image
        run: |
          set -euo pipefail
          if [ ! -f "Dockerfile" ]; then
            echo "No Dockerfile; skipping image signature verification"
            echo "status=not_applicable" >> "$GITHUB_OUTPUT"
            echo "reason=No Dockerfile is present" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! command -v crane >/dev/null 2>&1; then
            curl -fsSL -o /tmp/crane.tar.gz \
              "https://github.com/google/go-containerregistry/releases/download/v0.20.3/go-containerregistry_Linux_x86_64.tar.gz"
            tar -xzf /tmp/crane.tar.gz -C /tmp crane
            sudo mv /tmp/crane /usr/local/bin/crane
          fi
          IMAGE_REF="${REGISTRY}/${IMAGE}:${IMAGE_TAG}"
          if ! IMAGE_DIGEST="$(crane digest "$IMAGE_REF" 2>/dev/null)"; then
            if [ "$REQUIRE_IMAGE_VERIFICATION" = "true" ]; then
              echo "::error::Image $IMAGE_REF is not published; strict image verification was requested."
              echo "status=failed" >> "$GITHUB_OUTPUT"
              echo "reason=Image $IMAGE_REF is not published and strict verification is enabled" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "::warning::Image $IMAGE_REF is not published; skipping verification. Set require-image-verification=true to fail."
            echo "status=not_found" >> "$GITHUB_OUTPUT"
            echo "reason=Image $IMAGE_REF is not published" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          if [ -z "$CERTIFICATE_IDENTITY_REGEXP" ]; then
            echo "::error::certificate-identity-regexp is required when verifying a published image."
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "reason=Trusted certificate identity regexp is missing" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if cosign verify \
              --certificate-identity-regexp "$CERTIFICATE_IDENTITY_REGEXP" \
              --certificate-oidc-issuer-regexp "$CERTIFICATE_OIDC_ISSUER_REGEXP" \
              "$IMAGE_REF"; then
            echo "status=verified" >> "$GITHUB_OUTPUT"
            echo "reason=Cosign verified $IMAGE_REF with the configured identity and issuer" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "reason=Cosign could not verify $IMAGE_REF with the configured identity and issuer" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Record image verification result
        id: record_image_verification
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify_image.outcome }}
          VERIFY_STATUS: ${{ steps.verify_image.outputs.status }}
          VERIFY_DIGEST: ${{ steps.verify_image.outputs.digest }}
          VERIFY_REASON: ${{ steps.verify_image.outputs.reason }}
        run: |
          set -euo pipefail
          status="${VERIFY_STATUS:-unknown}"
          reason="${VERIFY_REASON:-Image verification did not produce a result}"
          if [ "$VERIFY_OUTCOME" = "skipped" ]; then
            status="not_requested"
            reason="Image verification step was skipped"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "digest=${VERIFY_DIGEST:-unknown}" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
      
      - name: Policy Validation
        run: |
          if [ ! -d policies/opa ] || [ ! -f deployment.json ]; then
            echo "No OPA policies or deployment.json; skipping policy validation"
            exit 0
          fi
          if ! command -v opa >/dev/null 2>&1; then
            curl -fsSL -o /tmp/opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
            chmod +x /tmp/opa
            sudo mv /tmp/opa /usr/local/bin/opa
          fi
          opa eval -d policies/opa/ -i deployment.json "data.deployment.allow"

  # Nested SLSA generator removed: same GITHUB_TOKEN startup_failure as
  # security-scan.yml. Restore with hashed SBOM subjects.

  # ♾️ OPERATE - Runtime Security
  operate-phase:
    if: inputs.phase == 'operate' || inputs.phase == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Deploy Security Monitoring
        run: |
          echo "Deploying Falco rules..."
          # kubectl apply -f monitoring/falco-rules.yaml
      
      - name: Configure Network Policies
        run: |
          echo "Applying network policies..."
          # kubectl apply -f policies/network-policies.yaml

  # ♾️ MONITOR - Continuous Monitoring
  monitor-phase:
    if: inputs.phase == 'monitor' || inputs.phase == 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check security alerts
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // GITHUB_TOKEN cannot read Dependabot alerts (needs
            // vulnerability_alerts=read, which Actions cannot grant). Treat
            // 403/404 as skip, not failure. Code scanning alerts work with
            // security-events, which callers already grant.
            try {
              const alerts = await github.rest.dependabot.listAlertsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              });
              if (alerts.data.length > 0) {
                core.warning(`Found ${alerts.data.length} open Dependabot alerts`);
              } else {
                core.info('No open Dependabot alerts');
              }
            } catch (err) {
              if (err.status === 403 || err.status === 404) {
                core.info(`Dependabot alerts not readable with this token (${err.status}); skipping.`);
              } else {
                throw err;
              }
            }

            try {
              const cs = await github.rest.codeScanning.listAlertsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              });
              if (cs.data.length > 0) {
                core.warning(`Found ${cs.data.length} open code scanning alerts`);
              } else {
                core.info('No open code scanning alerts');
              }
            } catch (err) {
              if (err.status === 403 || err.status === 404) {
                core.info(`Code scanning alerts unavailable (${err.status}).`);
              } else {
                throw err;
              }
            }

      - name: Security Metrics
        run: |
          echo "Collecting security metrics..."
