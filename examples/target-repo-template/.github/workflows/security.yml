name: Security Compliance

# Default permissions: grant the workflow the minimal elevated permissions needed
# for signing and uploading provenance when enabled. Callers running this
# workflow will grant these permissions in their repo; remove or restrict
# these if you do not want to allow write operations from the workflow.
permissions:
  id-token: write
  contents: read
  packages: write
  security-events: write
  pull-requests: write
  # Uncomment when artifact-path is configured below.
  # attestations: write

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: '0 0 * * 0' # Weekly scan
  workflow_dispatch:

jobs:
  security:
    uses: acald-creator/security-compliance-hub/.github/workflows/security-scan.yml@v0.2.5
    with:
      severity-threshold: HIGH
      compliance-frameworks: openssf,owasp,slsa
      enable-signing: true
      # Optional: attest a built artifact with GitHub's SLSA provenance.
      # artifact-name: build-artifact
      # artifact-path: dist/example
    secrets:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  devsecops:
    uses: acald-creator/security-compliance-hub/.github/workflows/devsecops-infinity.yml@v0.2.5
    with:
      phase: all
      # Required when a published image should be verified during deploy.
      # certificate-identity-regexp: '^https://github.com/OWNER/REPO/.github/workflows/.*@refs/heads/main$'
      # require-image-verification: true
